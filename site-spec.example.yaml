# Optional player-facing Route paths (Route Data Contract).
# - Route = player frontend task path (`/{hubPath}/routes/{routeId}/`); Category = backend/sidebar organization.
# - routes[].pages is the ONLY authoritative source for which Guide belongs to which Route.
#   Do not also list routes on a page (no page.routes) — that would create two sources of truth.
# - A Guide may belong to several Routes. Route is a graph/path, not a folder.
# - pages order is meaningful and preserved by the generator (Follow the Route).
# - fastAnswers (max 3) must reference pages that belong to the same route. Distinct from homepage.popularQuestions.
# - visualAssetId references the existing assets[]. Omit for a content-only route.
# The fictional demo game only ships 3 pages, so routes reuse pages to demonstrate multiple membership.
routes:
  - id: getting-started
    eyebrow: New Player Route
    title: Getting Started
    description: Everything you need before your first serious run — read in order.
    visualAssetId: default-og
    fastAnswers:
      - question: How do I get started?
        answer: Begin with the Beginner Guide.
        pageId: beginner-guide
      - question: What should I check first?
        answer: Confirm the system requirements first.
        pageId: system-requirements
      - question: What should I learn first?
        answer: Understand the core gameplay loop.
        pageId: gameplay-overview
    pages:
      - beginner-guide
      - system-requirements
      - gameplay-overview
  - id: core-gameplay
    eyebrow: Core Systems
    title: Core Gameplay
    description: The systems behind exploration, combat, and progression.
    fastAnswers:
      - question: What is the core loop?
        answer: Explore, fight, and level up.
        pageId: gameplay-overview
    pages:
      - gameplay-overview
      - beginner-guide
  - id: world-exploration
    eyebrow: Exploration
    title: World & Exploration
    description: What to learn before you start moving through the world.
    visualAssetId: default-og
    pages:
      - gameplay-overview
  - id: story-characters
    eyebrow: Story & Characters
    title: Story & Characters
    description: Story and character context that new players should know.
    pages:
      - beginner-guide

